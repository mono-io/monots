name: Package

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: dist · upload artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            libsasl2-dev \
            libcurl4-openssl-dev \
            protobuf-compiler \
            zip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      # Release + cross-target (make dist) compile cache.
      - name: Cache Rust compile artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: monots-cargo-v1
          shared-key: package-release
          key: ${{ runner.os }}-gnu
          cache-targets: "true"
          cache-all-crates: "true"
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build and package release layout
        run: make dist

      - name: Upload dist archives
        uses: actions/upload-artifact@v4
        with:
          name: monots-dist-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

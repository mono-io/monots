name: Unit Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ut-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  unit-test:
    name: license · fmt · clippy · cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libssl-dev \
            libsasl2-dev \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      # Cache ~/.cargo + target/ (deps + compile artifacts).
      # PRs restore from main; only main/master writes a new cache entry.
      - name: Cache Rust compile artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: monots-cargo-v1
          shared-key: ut-debug
          cache-targets: "true"
          cache-all-crates: "true"
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Check license headers
        run: make check-license

      - name: Check Rust formatting
        run: make fmt-check

      - name: Clippy gate (correctness + suspicious + dead_code)
        run: make clippy

      - name: Run unit tests
        run: make test

[workspace]
members = [
    "src/common",
    "proto",
    "src/catalog",
    "src/storage",
    "src/query",
    "src/stream",
    "src/core",
    "src/server",
    "sdk",
    "cli/cli",
    "tests/integration",
    "benchmark",
]
resolver = "2"
default-members = ["src/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
sysinfo = "0.33"
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arrow = { version = "53", features = ["ipc"] }
parquet = { version = "53", features = ["arrow", "async"] }
datafusion = "43"
async-trait = "0.1"
parking_lot = "0.12"
bytes = "1.7"
uuid = { version = "1.11", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
rustyline = "15"
comfy-table = "7.1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
reqwest = { version = "0.12", features = ["stream"] }
serde_yaml = "0.9"
dashmap = "5.5"
arc-swap = "1.7"
libc = "0.2"
crc32fast = "1.4"
lru = "0.12"

# arrow-arith 53.4.0 + chrono >=0.4.40: disambiguate Datelike::quarter (see patches/).
[patch.crates-io]
arrow-arith = { path = "patches/arrow-arith-53.4.0" }

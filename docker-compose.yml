services:
  monots:
    build:
      context: .
      dockerfile: Dockerfile
    image: monots:latest
    container_name: monots
    ports:
      - "50051:50051"
    volumes:
      - monots-data:/opt/monots/data
      - monots-logs:/opt/monots/logs
      - ./conf/config.yaml:/opt/monots/conf/config.yaml:ro
    environment:
      MONOTS_HOME: /opt/monots
      MONOTS_CONF: /opt/monots/conf/config.yaml
      MONOTS_DATA_DIR: /opt/monots/data
      MONOTS_LOG_DIR: /opt/monots/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "monots --host http://127.0.0.1:50051 --sql 'SHOW TABLES' >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  monots-data:
  monots-logs:

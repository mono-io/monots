syntax = "proto3";
package monots.stream;

// On-disk stream control-plane metadata (under {data_dir}/streams/*.pb).
//
// Compatibility rules (MUST follow):
// 1. Never reuse / renumber fields; only append new field numbers.
// 2. Bump schema_version when the writer understands a newer layout.
// 3. Set min_reader_version when older binaries must not load this file.
// 4. Older readers skip unknown fields (proto3 wire); they MUST NOT rewrite a
//    file whose schema_version is greater than their own (would drop fields).
// 5. Prefer optional / map for additive evolution; avoid renaming enums values.

enum ConnectorType {
  CONNECTOR_TYPE_UNSPECIFIED = 0;
  // Retired: MONOTS=1, ICEBERG=3, JSON=5 — never reuse these numbers.
  reserved 1, 3, 5;
  reserved "CONNECTOR_TYPE_MONOTS", "CONNECTOR_TYPE_ICEBERG", "CONNECTOR_TYPE_JSON";
  CONNECTOR_TYPE_DELTA = 2;
  CONNECTOR_TYPE_KAFKA = 4;
  CONNECTOR_TYPE_FILESYSTEM = 6;
  // Next id: 7
}

enum StreamCaptureMode {
  STREAM_CAPTURE_MODE_UNSPECIFIED = 0;
  STREAM_CAPTURE_MODE_BATCH = 1;
  STREAM_CAPTURE_MODE_LOG = 2;
  STREAM_CAPTURE_MODE_HYBRID = 3;
  // Next id: 4
}

enum StreamPhase {
  STREAM_PHASE_UNSPECIFIED = 0;
  STREAM_PHASE_INACTIVE = 1;
  STREAM_PHASE_PREPARING_LOG = 2;
  STREAM_PHASE_SYNCING_BATCH = 3;
  STREAM_PHASE_SYNCING_LOG = 4;
  STREAM_PHASE_ACTIVE = 5;
  STREAM_PHASE_COMPLETED = 6;
  STREAM_PHASE_SUSPENDED = 7;
  STREAM_PHASE_FAILED = 8;
  // Next id: 9
}

message TableStreamStatus {
  string table_name = 1;
  uint64 batch_files_total = 2;
  uint64 batch_files_acked = 3;
  reserved 4; // was rows_synced
  optional string last_acked_file = 5;
  uint64 acked_lsn = 6;
  int64 log_watermark = 7;
  bool batch_complete = 8;
  bool log_complete = 9;
  reserved 10 to 31;
}

message StreamStatus {
  StreamPhase phase = 1;
  int64 log_channel_opened_ms = 2;
  string current_step = 3;
  repeated TableStreamStatus tables = 4;
  uint64 batch_files_total = 5;
  uint64 batch_files_done = 6;
  reserved 7; // was rows_synced
  int64 log_watermark = 8;
  optional string last_error = 9;
  reserved 10 to 31;
}

message StreamDef {
  string name = 1;
  ConnectorType connector_type = 2;
  repeated string source_tables = 3;
  StreamCaptureMode capture_mode = 4;
  string delivery_format = 5;
  bool delivery_files = 6;
  reserved 7; // formerly consumer_id (DDL sink.consumer removed)
  reserved "consumer_id";
  optional string sink_path = 8;
  optional string kafka_brokers = 9;
  optional string kafka_topic = 10;
  int64 from_timestamp = 11;
  optional int64 to_timestamp = 12;
  bool auto_end = 13;
  map<string, string> properties = 14;
  reserved 15; // formerly StreamStatus — runtime-only, never on disk
  int64 created_at_ms = 16;
  // Additive domain fields start at 17+.
  // S3-compatible endpoint for delta sinks (MinIO / custom S3), from DDL `sink.delta.endpoint`.
  optional string sink_endpoint = 17;
  reserved 64 to 127;
}

// Versioned file envelope for `{name}.pb`.
message StreamDefFile {
  // Writer schema version (monotonic). Current = 1.
  uint32 schema_version = 1;
  // Minimum reader schema version required to interpret `def` safely.
  // If reader_version < min_reader_version → refuse load (ask user to upgrade).
  uint32 min_reader_version = 2;
  StreamDef def = 3;
  reserved 4 to 15;
}

// Source checkpoint (under {data_dir}/sync_checkpoints/*.pb).
message TableCheckpoint {
  repeated string acked_files = 1;
  reserved 2; // was rows_synced
  uint64 acked_lsn = 3;
  int64 log_watermark = 4;
  bool batch_complete = 5;
  bool log_complete = 6;
  reserved 7 to 31;
}

message StreamCheckpoint {
  string stream_name = 1;
  string consumer_id = 2;
  int64 log_channel_opened_ms = 3;
  map<string, TableCheckpoint> tables = 4;
  reserved 5 to 31;
}

message StreamCheckpointFile {
  uint32 schema_version = 1;
  uint32 min_reader_version = 2;
  StreamCheckpoint checkpoint = 3;
  reserved 4 to 15;
}

syntax = "proto3";
package tsdb;

option go_package = "github.com/monots/monots/clients/go/monots/proto";
option java_package = "com.monots.proto";
option java_multiple_files = true;

service EdgeTsdb {
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc WriteData(stream WriteRequest) returns (WriteResponse);
    rpc Query(QueryRequest) returns (stream QueryResponse);
    rpc NoQuery(NoQueryRequest) returns (NoQueryResponse);
    rpc LoadFile(LoadFileRequest) returns (LoadFileResponse);
    rpc BulkLoad(BulkLoadRequest) returns (BulkLoadResponse);
    rpc CreateTable(CreateTableRequest) returns (CreateTableResponse);
    rpc AddColumn(AddColumnRequest) returns (AddColumnResponse);
    rpc DropTable(DropTableRequest) returns (DropTableResponse);
    rpc GetMemoryStats(GetMemoryStatsRequest) returns (GetMemoryStatsResponse);
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    bool success = 1;
    string token = 2;
    string message = 3;
}

message WriteRequest {
    string table_name = 1;
    bytes payload = 2;
}

message WriteResponse {
    bool success = 1;
    uint64 rows_inserted = 2;
    string message = 3;
}

message QueryRequest {
    string sql = 1;
}

message QueryResponse {
    bytes payload = 1;
}

message NoQueryRequest {
    string sql = 1;
}

message NoQueryResponse {
    bool success = 1;
    uint64 rows_affected = 2;
    string message = 3;
}

message LoadFileRequest {
    string table_name = 1;
    string file_path = 2;
    string format = 3;
}

message LoadFileResponse {
    bool success = 1;
    uint64 rows_loaded = 2;
    string message = 3;
}

message BulkLoadRequest {
    string table_name = 1;
    repeated string paths = 2;
    string format = 3;
}

message BulkLoadResponse {
    bool success = 1;
    uint64 rows_loaded = 2;
    uint32 files_loaded = 3;
    string message = 4;
}

message ColumnDef {
    string name = 1;
    string data_type = 2;
    bool nullable = 3;
}

message CreateTableRequest {
    string table_name = 1;
    repeated ColumnDef columns = 2;
}

message CreateTableResponse {
    bool success = 1;
    string message = 2;
}

message AddColumnRequest {
    string table_name = 1;
    ColumnDef column = 2;
}

message AddColumnResponse {
    bool success = 1;
    string message = 2;
}

message DropTableRequest {
    string table_name = 1;
    bool if_exists = 2;
}

message DropTableResponse {
    bool success = 1;
    string message = 2;
}

message GetMemoryStatsRequest {}

message GetMemoryStatsResponse {
    uint64 used_bytes = 1;
    uint64 limit_bytes = 2;
    uint64 memtable_max_bytes = 3;
}

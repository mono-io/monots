[package]
name = "monots-stream"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "monots_stream"
path = "src/lib.rs"

[dependencies]
common = { path = "../common" }
monots-catalog = { path = "../catalog" }
monots-storage = { path = "../storage" }
proto = { path = "../../proto" }
arrow = { workspace = true }
arrow-json = "53"
parquet = { workspace = true }
datafusion = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
prost = { workspace = true }
crc32fast = { workspace = true }
futures = "0.3"
thiserror = { workspace = true }
rand = "0.8"
bytes = { workspace = true }
# `curl` is required: librdkafka 2.12.x (via rdkafka-sys 4.10) still includes
# curl/curl.h when WITH_CURL=0 due to an `#ifdef WITH_OAUTHBEARER_OIDC` bug.
# See https://github.com/fede1024/rust-rdkafka/issues/829
rdkafka = { version = "0.37", features = ["cmake-build", "tokio", "curl"] }
# Arrow-53 compatible deltalake; FunctionStream uses 0.32 (Arrow 55).
# `s3` enables official s3:// / MinIO handlers (requires rustc >= 1.94.1 — see rust-toolchain.toml).
deltalake = { version = "0.22.3", default-features = false, features = ["s3"] }
object_store = { version = "0.11", features = ["aws"] }
# Arrow-53 compatible Iceberg stack (0.5+ bumps Arrow).
# Note: iceberg-catalog-hms 0.4 pulls hive_metastore which fails to compile on
# modern rustc (Default derives). Hive DDL is accepted; runtime asks for rest/hadoop.
iceberg = { version = "0.4.0", default-features = false }
iceberg-catalog-rest = { version = "0.4.0", default-features = false }
iceberg-catalog-glue = { version = "0.4.0", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
# Pure-Rust Pulsar client (no C++ dependency). Transactions / EOS not available yet.
pulsar = { version = "6.8", default-features = false, features = ["tokio-runtime", "compression"] }

[dev-dependencies]

[features]
default = ["kafka", "delta", "iceberg", "pulsar"]
kafka = []
delta = []
iceberg = []
pulsar = []

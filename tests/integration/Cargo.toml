[package]
name = "monots-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[lib]
path = "src/lib.rs"

[dependencies]
sdk = { path = "../../sdk" }
common = { path = "../../src/common" }
proto = { path = "../../proto" }
monots-core = { path = "../../src/core" }
monots-storage = { path = "../../src/storage" }
tokio = { workspace = true }
uuid = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
libc = "0.2"
rdkafka = { version = "0.37", features = ["cmake-build", "tokio", "curl"] }
object_store = { version = "0.11", features = ["aws"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
tempfile = "3"
serde = { workspace = true }
serde_json = { workspace = true }
pretty_assertions = "1"
reqwest = { workspace = true }

# ---------------------------------------------------------------------------
# Integration tests live under tests/<category>/<name>.rs
# Cargo does not auto-discover nested paths — declare each target here.
# Run one binary:  cargo test -p monots-integration-tests --test write_dedup
# Or category:     make -C tests/integration test-write
# ---------------------------------------------------------------------------

# --- auth ---
[[test]]
name = "auth_login"
path = "tests/auth/login.rs"

# --- ddl ---
[[test]]
name = "ddl_catalog_list"
path = "tests/ddl/catalog_list.rs"

[[test]]
